name: Relax Submodule Sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Check Relax submodule updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Verify submodule registration
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --stage 3rdparty/tvm
          test -f 3rdparty/tvm/CMakeLists.txt
          git submodule status 3rdparty/tvm

      - name: Fetch latest Relax revision (review only)
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --remote --init 3rdparty/tvm
          echo 'Submodule change (if any):'
          git diff --submodule=log -- 3rdparty/tvm
          echo 'Current submodule status:'
          git submodule status 3rdparty/tvm
          if git diff --quiet -- 3rdparty/tvm; then
            echo 'No Relax revision change.'
          else
            echo 'Relax changed locally in this runner. No commit or push will occur.'
            echo 'Review compatibility before updating the pinned submodule SHA.'
          fi
