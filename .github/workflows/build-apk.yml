
name: Android APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;26.3.11579264"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang
          python3 -m pip install --user \
            numpy packaging typing_extensions ml_dtypes

      - name: Verify native sources
        run: |
          test -f android/mlc4j/prepare_libs.py
          test -f android/MLCChat/gradlew
          test -f 3rdparty/tvm/CMakeLists.txt || {
            echo "TVM source is missing"
            exit 1
          }

      - name: Prepare Python environment
        run: |
          python3 -m pip install --user -e . --no-build-isolation

      - name: Build MLC Android libraries
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: |
          python3 - <<'PY'
          import os
          os.cpu_count = lambda: 2
          from android.mlc4j.prepare_libs import main
          from pathlib import Path
          main(Path.cwd())
          PY

      - name: Inspect native outputs
        run: |
          find build android/mlc4j -type f \
            \( -name "*.so" -o -name "*.jar" \) -print

      - name: Build Android APK
        working-directory: android/MLCChat
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MLC-Enterprise-AI-Studio-Debug-APK
          path: android/MLCChat/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
