
name: Android APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize and verify submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

          test -f 3rdparty/tvm/CMakeLists.txt || {
            echo "::error::TVM dependency missing"
            exit 1
          }

          test -d 3rdparty/tokenizers-cpp || {
            echo "::error::tokenizers-cpp dependency missing"
            exit 1
          }

          echo "Required third-party directories found"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          test -n "$SDK_ROOT" || {
            echo "::error::Android SDK not found"
            exit 1
          }

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi

          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || {
            echo "::error::sdkmanager not found"
            exit 1
          }

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            'platform-tools' \
            'platforms;android-34' \
            'build-tools;34.0.0' \
            'ndk;26.3.11579264'

          echo "ANDROID_NDK=$SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang pkg-config
          python -m pip install --upgrade pip
          python -m pip install numpy packaging typing_extensions ml_dtypes

      - name: Install MLC Python package
        shell: bash
        run: |
          python -m pip install -e . --no-build-isolation

      - name: Verify Android project files
        shell: bash
        run: |
          test -f android/mlc4j/prepare_libs.py
          test -f android/MLCChat/gradlew

      - name: Build MLC Android libraries
        shell: bash
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          os.cpu_count = lambda: 2
          from android.mlc4j.prepare_libs import main
          main(Path.cwd())
          PY

      - name: Inspect native outputs
        shell: bash
        run: |
          find build android/mlc4j -type f \
            \( -name '*.so' -o -name '*.jar' \) -print 2>/dev/null || true

      - name: Build Android debug APK
        working-directory: android/MLCChat
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MLC-Enterprise-AI-Studio-Debug-APK
          path: android/MLCChat/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
