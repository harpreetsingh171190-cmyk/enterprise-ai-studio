name: Android APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Android SDK from runner
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          test -d "$SDK"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'

      - name: Install Android NDK
        shell: bash
        run: |
          "$SDKMANAGER" --install 'ndk;26.3.11579264'
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install native build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang pkg-config
          python -m pip install --upgrade pip
          python -m pip install numpy packaging typing_extensions ml_dtypes

      - name: Verify required source files
        shell: bash
        run: |
          test -f android/mlc4j/prepare_libs.py
          test -f android/MLCChat/gradlew
          test -f 3rdparty/tvm/CMakeLists.txt

      - name: Install MLC Python package
        shell: bash
        run: |
          python -m pip install -e . --no-build-isolation

      - name: Prepare MLC Android native libraries
        shell: bash
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          os.cpu_count = lambda: 2
          from android.mlc4j.prepare_libs import main
          main(Path.cwd())
          PY

      - name: Inspect native library outputs
        shell: bash
        run: |
          find build android/mlc4j -type f \( -name '*.so' -o -name '*.jar' \) -print 2>/dev/null || true

      - name: Assemble debug APK
        working-directory: android/MLCChat
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MLC-Enterprise-AI-Studio-Debug-APK
          path: android/MLCChat/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
