name: Build Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test_linux:
    name: Deploy Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip wheel

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Install documentation dependencies
        run: |
          python -m pip install -r docs/requirements.txt
          gem install jekyll jekyll-remote-theme --no-document

      - name: Verify documentation scripts
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/gh_deploy_site.sh
          test -f scripts/build_mlc_for_docs.sh
          bash -n scripts/gh_deploy_site.sh
          bash -n scripts/build_mlc_for_docs.sh
          chmod +x scripts/build_mlc_for_docs.sh
          ls -l scripts/gh_deploy_site.sh scripts/build_mlc_for_docs.sh

      - name: Deploy on GitHub Pages
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          # PAT secret hove taan oh vartao, nahi taan automatic GITHUB_TOKEN
          MLC_GITHUB_TOKEN: ${{ secrets.MLC_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$MLC_GITHUB_TOKEN" ]]; then
            echo 'No GitHub token available.' >&2
            exit 1
          fi
          git remote set-url origin "https://x-access-token:${MLC_GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.email 'mlc-gh-actions-bot@nomail'
          git config --global user.name 'mlc-gh-actions-bot'
          bash ./scripts/gh_deploy_site.sh
