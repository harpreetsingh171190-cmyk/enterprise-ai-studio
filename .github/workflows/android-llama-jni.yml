name: Android llama.cpp JNI compile check

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/MLCChat/app/src/main/cpp/**'
      - 'android/MLCChat/app/src/main/java/ai/mlc/mlcchat/enterprise/**'
      - '.github/workflows/android-llama-jni.yml'

permissions:
  contents: read

jobs:
  native-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Android NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
          if [[ -z "$NDK" || ! -f "$NDK/build/cmake/android.toolchain.cmake" ]]; then
            echo 'Android NDK toolchain not found on runner.' >&2
            exit 1
          fi
          echo "ANDROID_NDK_PATH=$NDK" >> "$GITHUB_ENV"
          cmake --version
          "$NDK/ndk-build" --version || true

      - name: Install pinned llama.cpp source
        shell: bash
        run: |
          set -euo pipefail
          test -f android/MLCChat/app/src/main/cpp/setup-llama.sh
          bash android/MLCChat/app/src/main/cpp/setup-llama.sh

      - name: Configure Android JNI
        shell: bash
        run: |
          set -euo pipefail
          cmake -S android/MLCChat/app/src/main/cpp -B "$RUNNER_TEMP/llama-android-build" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile JNI native library
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$RUNNER_TEMP/llama-android-build" --target enterprise_gguf --parallel 2 --verbose

      - name: Upload native build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-llama-jni-arm64-v8a
          path: |
            ${{ runner.temp }}/llama-android-build/**/*.so
          if-no-files-found: warn
          retention-days: 7
