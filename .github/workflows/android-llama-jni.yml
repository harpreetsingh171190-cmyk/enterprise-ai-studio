
name: Windows CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-ci-fixed.yml"
      - "ci/**"
      - "3rdparty/**"
      - ".gitmodules"
      - "CMakeLists.txt"
      - "pyproject.toml"
      - "python/**"
      - "cpp/**"

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Windows:
    name: Build MLC-LLM Windows
    runs-on: windows-latest
    timeout-minutes: 120

    defaults:
      run:
        shell: cmd /C call {0}

    steps:
      - name: Configure Git long paths
        run: |
          git config --global core.longpaths true

      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify Git submodules
        run: |
          git submodule status
          if not exist "3rdparty\tvm\CMakeLists.txt" exit /b 1
          if not exist "3rdparty\tokenizers-cpp\CMakeLists.txt" exit /b 1

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: mlc-llm-build
          channel-priority: strict
          environment-file: ci/build-environment.yaml
          auto-activate-base: false

      - name: Conda environment information
        run: |
          conda info
          conda list
          python --version

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install LLVM development dependencies
        run: |
          conda install -n mlc-llm-build -c conda-forge -y "llvmdev>=15"
          if errorlevel 1 exit /b 1

      - name: Verify LLVM development installation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          conda list -n mlc-llm-build llvmdev
          if ($LASTEXITCODE -ne 0) {
            throw "Cannot inspect LLVM package"
          }

          $prefix = (
            conda run -n mlc-llm-build python -c "import sys; print(sys.prefix)"
          ) | Select-Object -Last 1

          $prefix = $prefix.Trim()
          Write-Host "Conda prefix: $prefix"

          $llvmConfigs = @(
            Get-ChildItem -Path $prefix `
              -Filter LLVMConfig.cmake `
              -Recurse -File -ErrorAction SilentlyContinue
          )

          if ($llvmConfigs.Count -eq 0) {
            throw "LLVMConfig.cmake not found in Conda environment"
          }

          $llvmDir = $llvmConfigs[0].DirectoryName

          Write-Host "LLVM_DIR=$llvmDir"

          "LLVM_DIR=$llvmDir" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if errorlevel 1 exit /b 1

          python -m pip install scikit-build-core ninja cmake packaging
          if errorlevel 1 exit /b 1

          python -c "import scikit_build_core.build; print('Build backend OK')"
          if errorlevel 1 exit /b 1

      - name: Verify MSVC and CMake
        run: |
          where cl
          if errorlevel 1 exit /b 1

          cl
          cmake --version
          ninja --version

      - name: Build MLC-LLM with LLVM
        env:
          SKBUILD_CMAKE_ARGS: "-DLLVM_DIR=${{ env.LLVM_DIR }} -DTVM_TIRX_USE_LLVM=ON"
        run: |
          echo LLVM_DIR=%LLVM_DIR%
          echo SKBUILD_CMAKE_ARGS=%SKBUILD_CMAKE_ARGS%

          call ci\task\build_win.bat
          if errorlevel 1 exit /b 1

      - name: Verify MLC Python package
        if: success()
        run: |
          python -m pip show mlc-llm
          if errorlevel 1 exit /b 1

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          path: |
            build/CMakeCache.txt
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeFiles/CMakeError.log
            build/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
          retention-days: 7
